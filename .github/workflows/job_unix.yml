name: Build Treon Reusable Workflow

on:
  workflow_call:
    inputs:
      runner:
        description: 'Runner labels as a JSON array string, e.g. ''["self-hosted", "igpu", "Linux"]'''
        required: true
        type: string
      runner-group:
        description: 'Runner group to select the runner from (leave empty for label-only runners)'
        required: false
        type: string
        default: ''
      python:
        required: true
        type: string
      container:
        required: true
        type: string
        default: null
      options:
        description: 'Docker options to use for the container, e.g. GPU device passthrough'
        required: false
        type: string
        default: ''
      test_only_changed:
        required: false
        type: boolean
        default: false
      ignore_list:
        required: false
        type: string
        default: ''
      test_list:
        description: 'Newline-separated list of notebook paths to test (relative to repo root)'
        required: false
        type: string
        default: ''
      batch:
        description: 'Batch identifier for unique artifact naming when running parallel batches'
        required: false
        type: string
        default: ''
      dashboard_data:
        description: 'Write a nightly dashboard data fragment (.ci/nightly_report) and upload it as an artifact'
        required: false
        type: boolean
        default: false

permissions:
  contents: read

env:
  PIP_CACHE_PATH: /mount/caches/pip
  MOUNT_CACHE: /mount/testdata0/ov_notebooks
  # Allow NLTK to download data through the configured proxy (SSRF opt-in).
  NLTK_ALLOW_PROXIED_URLOPEN: "1"
  NODE_EXTRA_CA_CERTS: /usr/local/share/ca-certificates/IntelProxyRootCA-Base64.crt


jobs:
  build_treon:
    runs-on: ${{ inputs['runner-group'] != '' && fromJSON(format('{{"group":"{0}","labels":{1}}}', inputs['runner-group'], inputs.runner)) || fromJSON(inputs.runner) }}
    defaults:
      run:
        shell: bash
    container:
      image: ${{ inputs.container }}
      options: ${{ inputs.options }}
      volumes:
        - /mount:/mount
        # Proxy root CA needed so git can clone over HTTPS on self-hosted GPU runners
        - /usr/local/share/ca-certificates:/usr/local/share/ca-certificates:ro
    steps:
      - name: Set env variables
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const runner = `${{ inputs.runner }}`.toLowerCase();
            const osName = runner.includes('mac') ? 'macos-13' : 'ubuntu-22.04';
            let deviceTag = 'cpu';
            let testDevice = 'cpu';
            if (runner.includes('igpu')) { deviceTag = 'igpu'; testDevice = 'gpu'; }
            else if (runner.includes('dgpu')) { deviceTag = 'dgpu'; testDevice = 'gpu'; }
            else if (runner.includes('gpu')) { deviceTag = 'gpu'; testDevice = 'gpu'; }
            const testReportDir = `${deviceTag}-${osName}-${{ inputs.python }}`;
            core.exportVariable('OS_NAME', osName);
            core.exportVariable('DEVICE_TAG', deviceTag);
            core.exportVariable('TEST_DEVICE', testDevice);
            core.exportVariable('TEST_REPORT_DIR', testReportDir);
            core.exportVariable('GIT_CLONE_PROTECTION_ACTIVE', 'false');

      # Add the proxy root CA (mounted at
      # /usr/local/share/ca-certificates) to it before cloning over HTTPS,
      # otherwise git fails with "server certificate verification failed"
      - name: Add proxy CA certificate to system trust store
        if: ${{ env.TEST_DEVICE == 'gpu' }}
        run: update-ca-certificates

      - name: Configure Python CA bundle
        if: ${{ env.TEST_DEVICE == 'gpu' }}
        run: |
          echo "SSL_CERT_FILE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"
          echo "REQUESTS_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt" >> "$GITHUB_ENV"

      - name: GPU diagnostics
        if: ${{ env.TEST_DEVICE == 'gpu' }}
        continue-on-error: true
        run: |
          ls -la /dev/dri
          for d in /sys/class/drm/renderD*; do
            [[ -e "$d" ]] || { echo "No render nodes found"; break; }
            driver=$(readlink "$d/device/driver" || echo none)
            echo "$(basename "$d") vendor=$(cat "$d/device/vendor") device=$(cat "$d/device/device") driver=$(basename "$driver")"
          done
          dpkg -l | grep -E 'intel-(opencl-icd|igc-core|level-zero-gpu)' || true
          clinfo -l || true

      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Get changed files
        if: ${{ inputs.test_only_changed }}
        id: changed-files
        uses: tj-actions/changed-files@9426d40962ed5378910ee2e21d5f8c6fcbf2dd96 # v47.0.6
        with:
          files: |
            notebooks/*/**
            requirements.txt

      - name: List all changed files
        if: ${{ inputs.test_only_changed }}
        shell: bash
        run: |
          changed_files="${{ steps.changed-files.outputs.all_changed_files }}"
          changed_files=$(echo $changed_files | tr '\\' '/')

          notebook_changed=false
          for file in $changed_files; do
            if [[ $file == notebooks/* ]]; then
              notebook_changed=true
              break
            fi
          done

          if [ "$notebook_changed" = true ]; then
            touch test_notebooks.txt
            for file in $changed_files; do
              echo "$file was changed"
              echo $file >> test_notebooks.txt
            done
          else
            echo "No notebook files changed, using precommit list"
            cp .ci/precommit_list.txt test_notebooks.txt
          fi

      - name: Write test list from input
        if: ${{ inputs.test_list != '' }}
        shell: bash
        run: |
          cat << 'EOF' > test_notebooks.txt
          ${{ inputs.test_list }}
          EOF
          # Remove leading whitespace added by heredoc indentation
          sed -i 's/^[[:space:]]*//' test_notebooks.txt
          # Remove empty lines
          sed -i '/^$/d' test_notebooks.txt
          echo "Notebooks to test ($(wc -l < test_notebooks.txt) total):"
          cat test_notebooks.txt
      
      - name: Install required packages (Linux)
        if: ${{ !inputs.container && runner.os == 'Linux' }}
        shell: bash
        run: |
          sudo apt-get update -y
          sudo apt-get install libsndfile1 ffmpeg espeak-ng -y
      
      - name: Install required packages (container)
        if: ${{ inputs.container }}
        shell: bash
        env:
          DEBIAN_FRONTEND: noninteractive # to prevent apt-get from waiting user input
          TZ: 'Europe/London' # to prevent tzdata from waiting user input
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            apt-get update -y
            apt-get install git curl wget libsndfile1 libssl-dev unzip libsqlite3-dev libedit-dev libgl1 libgl1-mesa-glx libglib2.0-0 ffmpeg tk -y
            wget https://raw.githubusercontent.com/openvinotoolkit/openvino/d9e6b4b29ab49e054fa602db1abae4ef9ace41da/scripts/install_dependencies/install_openvino_dependencies.sh
            chmod +x ./install_openvino_dependencies.sh
            ./install_openvino_dependencies.sh -c=core -c=dev -c=gpu -y
          fi

      # Image's compute-runtime 24.05 can't see Arc B-series; 25.13 is the last release built for Ubuntu 22.04
      - name: Install GPU driver
        if: ${{ env.TEST_DEVICE == 'gpu' && runner.os == 'Linux' }}
        run: |
          NEO_URL=https://github.com/intel/compute-runtime/releases/download/25.13.33276.16
          IGC_URL=https://github.com/intel/intel-graphics-compiler/releases/download/v2.10.8
          mkdir -p /tmp/neo && cd /tmp/neo
          wget -q \
            "${IGC_URL}/intel-igc-core-2_2.10.8+18926_amd64.deb" \
            "${IGC_URL}/intel-igc-opencl-2_2.10.8+18926_amd64.deb" \
            "${NEO_URL}/intel-level-zero-gpu_1.6.33276.16_amd64.deb" \
            "${NEO_URL}/intel-opencl-icd_25.13.33276.16_amd64.deb" \
            "${NEO_URL}/libigdgmm12_22.7.0_amd64.deb"
          # IGC 2.x packages have new names and would clash with the 1.x ones from the image
          dpkg --purge intel-opencl-icd intel-level-zero-gpu intel-igc-opencl intel-igc-core
          dpkg -i *.deb
          cd / && rm -rf /tmp/neo
          dpkg -l | grep -E 'intel-(opencl-icd|igc-core|level-zero-gpu)|libigdgmm'

      - name: GPU diagnostics (OpenVINO devices)
        if: ${{ env.TEST_DEVICE == 'gpu' && runner.os == 'Linux' }}
        env:
          EXPECTED_GPU_TYPE: ${{ env.DEVICE_TAG == 'dgpu' && 'DISCRETE' || env.DEVICE_TAG == 'igpu' && 'INTEGRATED' || '' }}
        run: |
          clinfo -l || true
          VENV=$(mktemp -d)/ov_devices_venv
          trap 'rm -rf "$(dirname "$VENV")"' EXIT
          python3 -m venv "$VENV"
          "$VENV/bin/python" -m pip install -q --no-cache-dir openvino
          "$VENV/bin/python" - <<'EOF'
          import os
          import sys

          import openvino as ov

          core = ov.Core()
          print(f"OpenVINO {ov.get_version()}")
          print(f"Available devices: {core.available_devices}")
          gpu_types = {}
          for device in core.available_devices:
              name = core.get_property(device, "FULL_DEVICE_NAME")
              kind = ""
              if device.startswith("GPU"):
                  kind = core.get_property(device, "DEVICE_TYPE")
                  gpu_types[device] = kind
              print(f"  {device}: {name} {kind}")

          expected = os.environ["EXPECTED_GPU_TYPE"]
          if not gpu_types:
              sys.exit("No GPU device is visible to OpenVINO")
          if expected:
              expected_type = getattr(ov.properties.device.Type, expected)
              wrong = {d: t for d, t in gpu_types.items() if t != expected_type}
              if wrong:
                  sys.exit(f"Expected only {expected} GPUs, got: {wrong}")
          EOF

      - name: Setup Python ${{ inputs.python }}
        uses: openvinotoolkit/openvino/.github/actions/setup_python@3c203973be08baa7eea263d06dd2f006d6b607d8
        with:
          version: ${{ inputs.python }}
          pip-cache-path: ${{ env.PIP_CACHE_PATH }}
          set-pip-install-path: 'true'
          self-hosted-runner: 'true'

      # actions/setup-python provides a shared-library CPython whose libpython
      # only lives in the interpreter's LIBDIR. Cloned venvs (validate_notebooks.py
      # --separate_venv) copy the interpreter and lose its RPATH, so libpython must
      # be discoverable via LD_LIBRARY_PATH.
      - name: Expose Python LIBDIR for cloned virtual environments
        if: runner.os == 'Linux'
        shell: bash
        run: |
          PYTHON_LIBDIR=$(python${{ inputs.python }} -c 'import sysconfig; print(sysconfig.get_config_var("LIBDIR"))')
          echo "Python LIBDIR: ${PYTHON_LIBDIR}"
          echo "LD_LIBRARY_PATH=${PYTHON_LIBDIR}${LD_LIBRARY_PATH:+:${LD_LIBRARY_PATH}}" >> "$GITHUB_ENV"

      - name: Create and check cache directory
        run: |
          mkdir -m 777 -p ${{ env.MOUNT_CACHE }}
          ls -la ${{ env.MOUNT_CACHE }}

      - name: Set cache environment variables
        if: ${{ env.TEST_DEVICE != 'gpu' }}
        run: |
          python${{ inputs.python }} -c 'import os;print("CACHE_DIR={0}".format(os.path.expanduser(os.path.join("${{ env.MOUNT_CACHE }}", "PaddleGAN"))))' | sed -e 's/\\/\//g' >> $GITHUB_ENV
          echo HUB_HOME=${{ env.MOUNT_CACHE }}/.paddlehub >> $GITHUB_ENV

      - name: Prepare CT files for ct-segmentation-quantize
        if: ${{ env.TEST_DEVICE != 'gpu' }}
        run: |
          if [[ ! -f ${{ env.MOUNT_CACHE }}/case_00030.zip ]]; then
            curl -o ${{ env.MOUNT_CACHE }}/case_00030.zip https://storage.openvinotoolkit.org/data/test_data/openvino_notebooks/kits19/case_00030.zip
          fi
          mkdir -p notebooks/ct-segmentation-quantize/kits19/kits19_frames
          cp ${{ env.MOUNT_CACHE }}/case_00030.zip .
          unzip case_00030.zip
          cp -r case_00030 case_00001
          mv case_00030 notebooks/ct-segmentation-quantize/kits19/kits19_frames
          mv case_00001 notebooks/ct-segmentation-quantize/kits19/kits19_frames

      - name: Prepare models for meter-reader and paddle-ocr-webcam
        if: ${{ env.TEST_DEVICE != 'gpu' }}
        run: |
          if [[ ! -f "${{ env.MOUNT_CACHE }}/meter_det_model.tar.gz" ]]; then
            curl -o ${{ env.MOUNT_CACHE }}/meter_det_model.tar.gz 'https://storage.openvinotoolkit.org/repositories/openvino_notebooks/models/meter-reader/meter_det_model.tar.gz'
          fi
          if [[ ! -f "${{ env.MOUNT_CACHE }}/meter_seg_model.tar.gz" ]]; then
            curl -o ${{ env.MOUNT_CACHE }}/meter_seg_model.tar.gz 'https://storage.openvinotoolkit.org/repositories/openvino_notebooks/models/meter-reader/meter_seg_model.tar.gz'
          fi
          if [[ ! -f "${{ env.MOUNT_CACHE }}/ch_PP-OCRv3_det_infer.tar" ]]; then
            curl -o ${{ env.MOUNT_CACHE }}/ch_PP-OCRv3_det_infer.tar 'https://storage.openvinotoolkit.org/repositories/openvino_notebooks/models/paddle-ocr/ch_PP-OCRv3_det_infer.tar'
          fi
          if [[ ! -f "${{ env.MOUNT_CACHE }}/ch_PP-OCRv3_rec_infer.tar" ]]; then
            curl -o ${{ env.MOUNT_CACHE }}/ch_PP-OCRv3_rec_infer.tar 'https://storage.openvinotoolkit.org/repositories/openvino_notebooks/models/paddle-ocr/ch_PP-OCRv3_rec_infer.tar'
          fi
          mkdir -p notebooks/meter-reader/model
          cp ${{ env.MOUNT_CACHE }}/meter_det_model.tar.gz notebooks/meter-reader/model/
          cp ${{ env.MOUNT_CACHE }}/meter_seg_model.tar.gz notebooks/meter-reader/model/
          mkdir -p notebooks/paddle-ocr-webcam/model
          cp ${{ env.MOUNT_CACHE }}/ch_PP-OCRv3_det_infer.tar notebooks/paddle-ocr-webcam/model/
          cp ${{ env.MOUNT_CACHE }}/ch_PP-OCRv3_rec_infer.tar notebooks/paddle-ocr-webcam/model/

      - name: Create source virtual env & install python dependencies
        run: |
          python${{ inputs.python }} -m venv .venv
          .venv/bin/python3 -m pip install --upgrade setuptools wheel
          .venv/bin/python3 -m pip install -r .ci/dev-requirements.txt
          .venv/bin/python3 -m ipykernel install --user

      - name: Check install
        run: .venv/bin/python3 check_install.py

      - name: Patch notebooks
        run: .venv/bin/python3 .ci/patch_notebooks.py . -td ${{ env.TEST_DEVICE }}

      - name: Test Jupyterlab
        run: .venv/bin/python3 -m jupyter lab notebooks --help

      - name: Analysing with treon (Linux)
        if: runner.os == 'Linux'
        shell: bash
        env:
          DASHBOARD_DATA: ${{ inputs.dashboard_data }}
          DASHBOARD_JOB_ID: ${{ job.check_run_id }}
          DASHBOARD_BATCH: ${{ inputs.batch }}
          DASHBOARD_RUNNER_NAME: ${{ runner.name }}
          DASHBOARD_RUNNER_LABEL: ${{ inputs.runner }}
          DASHBOARD_DEVICE_TAG: ${{ env.DEVICE_TAG }}
          DASHBOARD_CONTAINER_IMAGE: ${{ inputs.container }}
        run: |
          IGNORE_ARGS=""
          if [[ -n "${{ inputs.ignore_list }}" ]]; then
            IGNORE_ARGS="$IGNORE_ARGS ${{ inputs.ignore_list }}"
          fi
          if [[ "${{ env.TEST_DEVICE }}" == "gpu" ]]; then
             IGNORE_ARGS="$IGNORE_ARGS .ci/heavy_ubuntu_gpu.txt"
          fi
          
          if [[ -n "$IGNORE_ARGS" ]]; then
            IGNORE_ARGS="--ignore_list $IGNORE_ARGS"
          fi

          DASHBOARD_ARGS=()
          if [[ "$DASHBOARD_DATA" == "true" ]]; then
            DASHBOARD_ARGS+=(--dashboard_dir dashboard_fragment --run_id "$GITHUB_RUN_ID" --run_attempt "$GITHUB_RUN_ATTEMPT")
            for pair in "--job_id=$DASHBOARD_JOB_ID" "--batch=$DASHBOARD_BATCH" "--runner_name=$DASHBOARD_RUNNER_NAME" \
                        "--runner_label=$DASHBOARD_RUNNER_LABEL" "--container_image=$DASHBOARD_CONTAINER_IMAGE" \
                        "--device_tag=$DASHBOARD_DEVICE_TAG"; do
              if [[ -n "${pair#*=}" ]]; then DASHBOARD_ARGS+=("$pair"); fi
            done
          fi

          .venv/bin/python3 .ci/validate_notebooks.py \
            --os ${{ env.OS_NAME }} \
            --python ${{ inputs.python }} \
            --device ${{ env.TEST_DEVICE }} \
            ${{ (inputs.test_only_changed || inputs.test_list != '') && '--test_list test_notebooks.txt' || '' }} \
            $IGNORE_ARGS \
            --report_dir test_report/${{ env.TEST_REPORT_DIR }}${{ inputs.batch != '' && '/' || '' }}${{ inputs.batch }} \
            --collect_reports \
            --timeout ${{ inputs.dashboard_data && 3600 || 1200 }} \
            "${DASHBOARD_ARGS[@]}"
      
      - name: Analysing with treon (MacOS)
        if: runner.os == 'MacOS'
        shell: bash
        env:
          DASHBOARD_DATA: ${{ inputs.dashboard_data }}
          DASHBOARD_JOB_ID: ${{ job.check_run_id }}
          DASHBOARD_BATCH: ${{ inputs.batch }}
          DASHBOARD_RUNNER_NAME: ${{ runner.name }}
          DASHBOARD_RUNNER_LABEL: ${{ inputs.runner }}
          DASHBOARD_DEVICE_TAG: ${{ env.DEVICE_TAG }}
        run: |
          DASHBOARD_ARGS=()
          if [[ "$DASHBOARD_DATA" == "true" ]]; then
            DASHBOARD_ARGS+=(--dashboard_dir dashboard_fragment --run_id "$GITHUB_RUN_ID" --run_attempt "$GITHUB_RUN_ATTEMPT")
            for pair in "--job_id=$DASHBOARD_JOB_ID" "--batch=$DASHBOARD_BATCH" "--runner_name=$DASHBOARD_RUNNER_NAME" "--runner_label=$DASHBOARD_RUNNER_LABEL" \
                        "--device_tag=$DASHBOARD_DEVICE_TAG"; do
              if [[ -n "${pair#*=}" ]]; then DASHBOARD_ARGS+=("$pair"); fi
            done
          fi

          python${{ inputs.python }} .ci/validate_notebooks.py \
            --os ${{ env.OS_NAME }} \
            --python ${{ inputs.python }} \
            --device ${{ env.TEST_DEVICE }} \
            ${{ (inputs.test_only_changed || inputs.test_list != '') && '--test_list test_notebooks.txt' || '' }} \
            --report_dir test_report/${{ env.TEST_REPORT_DIR }}${{ inputs.batch != '' && '/' || '' }}${{ inputs.batch }} \
            --collect_reports \
            --timeout ${{ inputs.dashboard_data && 3600 || 1200 }} \
            "${DASHBOARD_ARGS[@]}"

      - name: Archive notebook test report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test_report-${{ env.TEST_REPORT_DIR }}-${{ inputs.batch != '' && inputs.batch || '' }}
          path: test_report/

      - name: Archive nightly dashboard data fragment
        if: ${{ always() && inputs.dashboard_data }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-fragment-${{ env.TEST_REPORT_DIR }}-${{ inputs.batch }}
          path: dashboard_fragment/
          if-no-files-found: ignore
          overwrite: true
