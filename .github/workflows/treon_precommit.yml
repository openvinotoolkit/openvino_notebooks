name: treon

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'main'
      - 'latest'
    paths:
      - 'notebooks/**.ipynb'
      - 'notebooks/**.py'
      - 'requirements.txt'
      - '.ci/*'
      - '.github/workflows/*.yml'
      - '.github/workflows/.env'
  push:
    branches:
      - 'main'
      - 'latest'
    paths:
      - 'notebooks/**.ipynb'
      - 'notebooks/**.py'
      - 'requirements.txt'
      - '.ci/*'
      - '.github/workflows/*.yml'
      - '.github/workflows/.env'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collect_notebooks:
    runs-on: ubuntu-latest
    outputs:
      batch_0: ${{ steps.split.outputs.batch_0 }}
      batch_1: ${{ steps.split.outputs.batch_1 }}
      batch_2: ${{ steps.split.outputs.batch_2 }}
      batch_3: ${{ steps.split.outputs.batch_3 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6

      - name: Collect and split notebooks into batches
        id: split
        run: python3 .ci/split_notebooks.py --num_batches 4 --seed "${{ github.run_id }}"

  build_treon_linux:
    needs: collect_notebooks
    strategy:
      fail-fast: false
      matrix:
        runs_on: [aks-linux-8-cores-32gb]
        # python: ['3.10', '3.11', '3.12', '3.13']
        python: ['3.12']
        batch: ['batch_0', 'batch_1', 'batch_2', 'batch_3']
    uses: ./.github/workflows/job_unix.yml
    with:
      runs_on: ${{ matrix.runs_on }}
      python: ${{ matrix.python }}
      test_list: ${{ matrix.batch == 'batch_0' && needs.collect_notebooks.outputs.batch_0 || matrix.batch == 'batch_1' && needs.collect_notebooks.outputs.batch_1 || matrix.batch == 'batch_2' && needs.collect_notebooks.outputs.batch_2 || needs.collect_notebooks.outputs.batch_3 }}
      batch_id: ${{ matrix.batch }}
      separate_venv: true
      container: 'openvinogithubactions.azurecr.io/ov_build/ubuntu_22_04_x64:pr-33079'
  
  build_treon_windows:
    needs: collect_notebooks
    strategy:
      fail-fast: false
      matrix:
        runs_on: [aks-win-8-cores-16gb-test]
        # python: ['3.10', '3.11', '3.12', '3.13']
        python: ['3.12']
        batch: ['batch_0', 'batch_1', 'batch_2', 'batch_3']
    uses: ./.github/workflows/job_windows.yml
    with:
      runs_on: ${{ matrix.runs_on }}
      python: ${{ matrix.python }}
      test_list: ${{ matrix.batch == 'batch_0' && needs.collect_notebooks.outputs.batch_0 || matrix.batch == 'batch_1' && needs.collect_notebooks.outputs.batch_1 || matrix.batch == 'batch_2' && needs.collect_notebooks.outputs.batch_2 || needs.collect_notebooks.outputs.batch_3 }}
      batch_id: ${{ matrix.batch }}
