name: treon

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'main'
      - 'latest'
    paths:
      - 'notebooks/**.ipynb'
      - 'notebooks/**.py'
      - 'requirements.txt'
      - '.ci/*'
      - '.github/workflows/*.yml'
      - '.github/workflows/.env'
  push:
    branches:
      - 'main'
      - 'latest'
    paths:
      - 'notebooks/**.ipynb'
      - 'notebooks/**.py'
      - 'requirements.txt'
      - '.ci/*'
      - '.github/workflows/*.yml'
      - '.github/workflows/.env'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  build_treon:
    strategy:
      fail-fast: false
      matrix:
        runs_on: [aks-linux-8-cores-32gb, aks-win-8-cores-16gb-test]
        python: ['3.10', '3.11', '3.12', '3.13']
    uses: ./.github/workflows/build_treon_reusable.yml
    with:
      runs_on: ${{ matrix.runs_on }}
      python: ${{ matrix.python }}
      test_only_changed: false
      container: ${{ contains(matrix.runs_on, 'linux') && 'openvinogithubactions.azurecr.io/ov_build/ubuntu_22_04_x64:pr-33079' || '' }}
