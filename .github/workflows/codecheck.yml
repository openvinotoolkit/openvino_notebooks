name: code_check

on:
  workflow_dispatch:
  schedule:
    - cron: '0 4 * * *'  # nightly at 4:00 UTC
  pull_request:
    branches:
      - 'main'
      - 'latest'
    paths:
      - '**.py'
      - 'notebooks/**.ipynb'
      - 'notebooks/**.md'
      - 'requirements.txt'
      - '.ci/*'
      - '.ci/nightly_report/**'
      - '.github/workflows/*.yml'
      - '.github/workflows/.env'
  push:
    branches:
      - 'main'
      - 'latest'
    paths:
      - '**.py'
      - 'notebooks/**.ipynb'
      - 'notebooks/**.md'
      - 'requirements.txt'
      - '.ci/*'
      - '.ci/nightly_report/**'
      - '.github/workflows/*.yml'
      - '.github/workflows/.env'

permissions:
  contents: read
  pull-requests: read

jobs:
  build_codecheck:
    strategy:
      fail-fast: false
    runs-on: ubuntu-22.04 # change cachepip step when changing this
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Dotenv Action
        id: dotenv
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0
        with:
          path: ./.github/workflows
      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: "3.11" # change cachepip step when changing this
      - name: Cache OpenVINO Pip Packages
        id: cachepip
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            pipcache
          key: ${{ env.PIP_CACHE_KEY }}-ubuntu-22.04-3.11
      - name: Cache openvino packages
        if: steps.cachepip.outputs.cache-hit != 'true'
        run: |
          python -m pip install --upgrade pip
          mkdir pipcache
          python -m pip install --cache-dir pipcache --no-deps openvino nncf
          cp -r pipcache pipcache_openvino
          python -m pip uninstall -y openvino nncf
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r .ci/dev-requirements.txt --cache-dir pipcache
          python -m ipykernel install --user --name openvino_env
      - name: Make pipcache directory with OpenVINO packages
        # Only cache OpenVINO packages. mv works cross-platform
        if: steps.cachepip.outputs.cache-hit != 'true'
        run: |
          mv pipcache pipcache_full
          mv pipcache_openvino pipcache
      - name: Pip freeze
        run: |
          python -m pip freeze
      - name: Check install
        if: always()
        run: |
          python check_install.py
      - name: Test Jupyterlab
        if: always()
        run: |
          jupyter lab notebooks --help
      - name: Flake8
        if: always()
        run: |
          nbqa flake8 --ignore=E124,E203,E231,E266,E402,E501,E703,F821,W503,W291,W293 --nbqa-exclude="(tensorflow-training-openvino|pytorch-quantization-aware-training)" notebooks
      - name: Black
        if: always()
        run: |
          black --check -l 160 .
      - name: Test READMEs and requirements
        if: always()
        run: |
          python -m pytest .ci/test_notebooks.py
      - name: Test nightly dashboard data scripts
        if: always()
        run: |
          python -m pytest .ci/nightly_report/tests
      - name: Get changed files
        id: changed
        if: always() && github.event_name == 'pull_request'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          CHANGED=$(gh pr diff ${{ github.event.pull_request.number }} --name-only | tr '\n' ' ')
          echo "files=$CHANGED" >> $GITHUB_OUTPUT
      - name: Test links from READMEs
        if: always()
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            python .ci/check_links.py ${{ steps.changed.outputs.files }}
          else
            python .ci/check_links.py
          fi
      - name: Test table of content and device widget
        if: always()
        run: |
          python .ci/check_notebooks.py
