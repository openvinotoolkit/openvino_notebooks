name: treon_nightly

on:
  workflow_dispatch:
    paths:
      - 'notebooks/**.ipynb'
      - 'notebooks/**.py'
      - 'requirements.txt'
      - '.ci/*'
      - '.github/workflows/*.yml'
      - '.github/workflows/.env'
  schedule:
    - cron: '0 0 * * *'
  pull_request:
    branches:
      - 'main'
      - 'latest'
    paths:
      - 'notebooks/**.ipynb'
      - 'notebooks/**.py'
      - 'requirements.txt'
      - '.ci/*'
      - '.github/workflows/*.yml'
      - '.github/workflows/.env'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  collect_notebooks:
    runs-on: ubuntu-latest
    outputs:
      batch_0: ${{ steps.split.outputs.batch_0 }}
      batch_1: ${{ steps.split.outputs.batch_1 }}
      batch_2: ${{ steps.split.outputs.batch_2 }}
      batch_3: ${{ steps.split.outputs.batch_3 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6

      - name: Collect and split notebooks into batches
        id: split
        run: python3 .ci/split_notebooks.py --num_batches 4 --seed "${{ github.run_id }}"

  build_treon_linux:
    needs: collect_notebooks
    strategy:
      fail-fast: false
      matrix:
        runs_on: [aks-linux-8-cores-32gb]
        python: ['3.10', '3.11', '3.12', '3.13']
        batch: ['batch_0', 'batch_1', 'batch_2', 'batch_3']
    uses: ./.github/workflows/job_unix.yml
    with:
      runs_on: ${{ matrix.runs_on }}
      python: ${{ matrix.python }}
      test_list: ${{ matrix.batch == 'batch_0' && needs.collect_notebooks.outputs.batch_0 || matrix.batch == 'batch_1' && needs.collect_notebooks.outputs.batch_1 || matrix.batch == 'batch_2' && needs.collect_notebooks.outputs.batch_2 || needs.collect_notebooks.outputs.batch_3 }}
      batch: ${{ matrix.batch }}
      separate_venv: true
      ignore_list: .ci/tensorflow.txt
      container: 'openvinogithubactions.azurecr.io/ov_build/ubuntu_22_04_x64:pr-33079'
  
  build_treon_windows:
    needs: collect_notebooks
    strategy:
      fail-fast: false
      matrix:
        runs_on: [aks-win-16-cores-32gb-full]
        python: ['3.10', '3.11', '3.12', '3.13']
        batch: ['batch_0', 'batch_1', 'batch_2', 'batch_3']
    uses: ./.github/workflows/job_windows.yml
    with:
      runs_on: ${{ matrix.runs_on }}
      python: ${{ matrix.python }}
      test_list: ${{ matrix.batch == 'batch_0' && needs.collect_notebooks.outputs.batch_0 || matrix.batch == 'batch_1' && needs.collect_notebooks.outputs.batch_1 || matrix.batch == 'batch_2' && needs.collect_notebooks.outputs.batch_2 || needs.collect_notebooks.outputs.batch_3 }}
      batch: ${{ matrix.batch }}
      separate_venv: true
      ignore_list: .ci/tensorflow.txt

  build_treon_gpu:
    if: ${{ false }} # TODO Enable when GPU runners will be available in GitHub Actions
    strategy:
      fail-fast: false
      matrix:
        runs_on: ['gpu']
        python: ['3.10', '3.11', '3.12', '3.13']
        container: ['ubuntu:20.04', 'ubuntu:22.04'] # Windows and macOS are not available in machine pool with GPU
    uses: ./.github/workflows/job_unix.yml
    with:
      runs_on: ${{ matrix.runs_on }}
      python: ${{ matrix.python }}
      container: ${{ matrix.container }}
      ignore_list: .ci/tensorflow.txt
      separate_venv: true

  aggregate_notebooks_reports:
    if: always()
    runs-on: ubuntu-22.04
    needs: [build_treon_linux, build_treon_windows, build_treon_gpu]
    steps:
      - name: Checkout repository
        uses: actions/checkout@a5ac7e51b41094c92402da3b24376905380afc29 # v4.1.6
      - name: Set up Python
        uses: actions/setup-python@82c7e631bb3cdc910f68e0081d67478d79c6982d # v5.1.0
        with:
          python-version: '3.10'
      - name: Collect artifacts with reports
        uses: actions/download-artifact@65a9edc5881444af0b9093a5e628f2fe47ea3b2e # v4.1.7
        with:
          pattern: test_report-*
          merge-multiple: true
          path: './test_reports'
      - name: Create aggregated report
        run: |
          python .ci/aggregate_notebooks_reports.py
      - name: Upload aggregated report
        uses: actions/upload-artifact@65462800fd760344b1a7b4382951275a0abb4808 # v4.3.3
        with:
          name: notebooks-status-map.json
          path: test_reports/notebooks-status-map.json
          if-no-files-found: error
