name: treon_nightly

on:
  workflow_dispatch:
  schedule:
    - cron: '0 0 * * *'

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.run_id }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  OV_BRANCH: 'master'

jobs:
  get_docker_tag:
    runs-on: ubuntu-latest
    outputs:
      docker_tag: ${{ steps.get_docker_tag.outputs.docker_tag }}
    steps:
    - name: Clone docker tag from OpenVINO repo
      uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      with:
        repository: 'openvinotoolkit/openvino'
        path: 'openvino'
        ref: ${{ env.OV_BRANCH }}
        sparse-checkout: |
          .github/dockerfiles/docker_tag

    - name: Save docker tag to output
      id: get_docker_tag
      run: |
        docker_tag=$(cat openvino/.github/dockerfiles/docker_tag)
        echo "docker_tag=$docker_tag" >> $GITHUB_OUTPUT

  collect_notebooks:
    runs-on: ubuntu-latest
    outputs:
      batch_0: ${{ steps.split.outputs.batch_0 }}
      batch_1: ${{ steps.split.outputs.batch_1 }}
      batch_2: ${{ steps.split.outputs.batch_2 }}
      batch_3: ${{ steps.split.outputs.batch_3 }}
      batch_4: ${{ steps.split.outputs.batch_4 }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Collect and split notebooks into batches
        id: split
        run: python3 .ci/split_notebooks.py --num_batches 5 --seed "${{ github.run_id }}" --plan_file nightly_plan/plan.json

      - name: Upload batch plan for the nightly dashboard
        continue-on-error: true
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-plan
          path: nightly_plan/plan.json
          if-no-files-found: warn
          overwrite: true

  build_treon_linux:
    needs: [collect_notebooks, get_docker_tag]
    strategy:
      fail-fast: false
      matrix:
        runs_on: [aks-linux-8-cores-32gb]
        python: ['3.11', '3.12', '3.13']
        batch: ['batch_0', 'batch_1', 'batch_2', 'batch_3', 'batch_4']
    uses: ./.github/workflows/job_unix.yml
    with:
      runner: '["aks-linux-8-cores-32gb"]'
      python: ${{ matrix.python }}
      test_list: ${{ needs.collect_notebooks.outputs[matrix.batch] }}
      batch: ${{ matrix.batch }}
      ignore_list: .ci/tensorflow.txt
      dashboard_data: true
      container: 'openvinogithubactions.azurecr.io/ov_build/ubuntu_22_04_x64:${{ needs.get_docker_tag.outputs.docker_tag }}'

  build_treon_windows:
    needs: collect_notebooks
    strategy:
      fail-fast: false
      matrix:
        runs_on: [aks-win-16-cores-32gb-full]
        python: ['3.11', '3.12', '3.13']
        batch: ['batch_0', 'batch_1', 'batch_2', 'batch_3', 'batch_4']
    uses: ./.github/workflows/job_windows.yml
    with:
      runs_on: ${{ matrix.runs_on }}
      python: ${{ matrix.python }}
      test_list: ${{ needs.collect_notebooks.outputs[matrix.batch] }}
      batch: ${{ matrix.batch }}
      ignore_list: .ci/tensorflow.txt
      dashboard_data: true

  build_treon_igpu:
    needs: [collect_notebooks, get_docker_tag]
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11']
        batch: ['batch_0', 'batch_1', 'batch_2', 'batch_3', 'batch_4']
    uses: ./.github/workflows/job_unix.yml
    with:
      runner: '["self-hosted", "igpu", "Linux"]'
      runner-group: 'Intel-GPU'
      python: ${{ matrix.python }}
      test_list: ${{ needs.collect_notebooks.outputs[matrix.batch] }}
      batch: ${{ matrix.batch }}
      container: 'openvinogithubactions.azurecr.io/ov_test/ubuntu_22_04_x64_igpu:${{ needs.get_docker_tag.outputs.docker_tag }}'
      options: '--group-add 44 --group-add 993 --device /dev/dri/renderD128:/dev/dri/renderD128'
      # Skip notebooks with blocked resources (195494), network errors, iGPU memory limits, or repeated timeouts
      ignore_list: .ci/not_allowed_resources.txt .ci/gpu_oom.txt .ci/igpu_timeouts.txt
      dashboard_data: true

  build_treon_dgpu:
    needs: [collect_notebooks, get_docker_tag]
    strategy:
      fail-fast: false
      matrix:
        python: ['3.11']
        batch: ['batch_0', 'batch_1', 'batch_2', 'batch_3', 'batch_4']
    uses: ./.github/workflows/job_unix.yml
    with:
      runner: '["self-hosted", "dgpu"]'
      runner-group: 'Intel-GPU'
      python: ${{ matrix.python }}
      test_list: ${{ needs.collect_notebooks.outputs[matrix.batch] }}
      batch: ${{ matrix.batch }}
      container: 'openvinogithubactions.azurecr.io/ov_test/ubuntu_22_04_x64_igpu:${{ needs.get_docker_tag.outputs.docker_tag }}'
      # renderD128 is the integrated GPU on these hosts; pass only the discrete one so "GPU" maps to it
      options: '--group-add 44 --group-add 993 --device /dev/dri/renderD129:/dev/dri/renderD129'
      # Skip notebooks that download resources from not-allowed domains (195494) or fail on network errors (e.g. 403)
      ignore_list: .ci/not_allowed_resources.txt
      dashboard_data: true

  aggregate_notebooks_reports:
    if: always()
    runs-on: ubuntu-22.04
    needs: [build_treon_linux, build_treon_windows, build_treon_igpu, build_treon_dgpu]
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'
      - name: Collect artifacts with reports
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test_report-*
          merge-multiple: true
          path: './test_reports'
      - name: Create aggregated report
        run: |
          python .ci/aggregate_notebooks_reports.py
      - name: Upload aggregated report
        # The selector (GitHub Pages) uses the latest artifact of this name, which must not come from a pull request run
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: notebooks-status-map.json
          path: test_reports/notebooks-status-map.json
          if-no-files-found: error

  # Builds the data consumed by the nightly dashboard (see .ci/nightly_report/README.md).
  # The dashboard repository pulls the 'nightly-dashboard-data' artifact via the GitHub API.
  build_dashboard_data:
    if: always()
    runs-on: ubuntu-22.04
    needs: [get_docker_tag, collect_notebooks, build_treon_linux, build_treon_windows, build_treon_igpu, build_treon_dgpu]
    permissions:
      contents: read
      actions: read # list jobs and artifacts of this run
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0 # history is needed for the last modification of notebooks
          filter: blob:none

      - name: Set up Python
        uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.11'

      - name: Install dependencies
        # psutil and virtualenv-clone are imported by validate_notebooks.py (skip resolution of crashed jobs)
        run: python -m pip install pyyaml==6.0.3 jsonschema==4.26.0 psutil==7.2.2 virtualenv-clone==0.5.7

      - name: Download batch plan
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nightly-plan
          path: nightly_plan

      - name: Download test job fragments
        continue-on-error: true
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          pattern: nightly-fragment-*
          path: nightly_fragments

      - name: Build dashboard data
        env:
          GITHUB_TOKEN: ${{ github.token }}
          DOCKER_TAG: ${{ needs.get_docker_tag.outputs.docker_tag }}
        run: |
          python .ci/nightly_report/build_report.py \
            --fragments_dir nightly_fragments \
            --plan nightly_plan/plan.json \
            --output_dir nightly_dashboard_data \
            --workflow_file .github/workflows/treon_nightly.yml \
            --ov_branch "$OV_BRANCH" \
            --docker_tag "$DOCKER_TAG" \
            --summary_file "$GITHUB_STEP_SUMMARY"

      - name: Upload dashboard data
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: nightly-dashboard-data
          path: nightly_dashboard_data/
          if-no-files-found: warn
          retention-days: 90
          overwrite: true
