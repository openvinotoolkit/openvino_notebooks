name: pip_conflicts_check

on:
  workflow_dispatch:
  pull_request:
    branches:
      - 'main'
      - 'latest'
    paths:
      - 'notebooks/**.ipynb'
  push:
    branches:
      - 'main'
      - 'latest'
    paths:
      - 'notebooks/**.ipynb'

permissions:
  contents: read

jobs:
  build_pip_conflicts_check:
    runs-on: ubuntu-22.04 # change cachepip step when changing this
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Dotenv Action
        id: dotenv
        uses: xom9ikk/dotenv@d0a56edc74279820eabbe34477511327e710d0de # v2.4.0
        with:
          path: ./.github/workflows

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.11' # change cachepip step when changing this

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install jupyter "notebook<7"

      - name: Run pip conflicts check
        run: |
          bash .ci/pip_conflicts_check.sh --ignore .ci/ignore_pip_conflicts.txt
