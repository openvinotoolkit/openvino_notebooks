<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 1000" width="1600" height="1000" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#37474f"/>
    </marker>
    <marker id="arg" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#9e9e9e"/>
    </marker>
    <linearGradient id="gpu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e3f2fd"/><stop offset="1" stop-color="#bbdefb"/></linearGradient>
    <linearGradient id="cpu" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fff8e1"/><stop offset="1" stop-color="#ffecb3"/></linearGradient>
    <linearGradient id="trk" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e8f5e9"/><stop offset="1" stop-color="#c8e6c9"/></linearGradient>
    <filter id="sh" x="-5%" y="-5%" width="110%" height="115%"><feDropShadow dx="2" dy="3" stdDeviation="3" flood-opacity="0.18"/></filter>
    <style>
      .t  { font-size: 15px; fill: #263238; }
      .ts { font-size: 12.5px; fill: #37474f; }
      .tx { font-size: 11.5px; fill: #546e7a; }
      .h  { font-size: 17px; font-weight: 700; fill: #0d47a1; }
      .hg { font-size: 17px; font-weight: 700; fill: #1b5e20; }
      .ho { font-size: 17px; font-weight: 700; fill: #e65100; }
      .box { stroke: #546e7a; stroke-width: 1.4; rx: 10; filter: url(#sh); }
      .flow { stroke: #37474f; stroke-width: 2.2; fill: none; marker-end: url(#ar); }
      .dash { stroke: #9e9e9e; stroke-width: 1.8; fill: none; stroke-dasharray: 6 5; marker-end: url(#arg); }
      .pulse { animation: pulse 3s ease-in-out infinite; }
      @keyframes pulse { 0%,100% { stroke-width: 1.4; } 50% { stroke-width: 3.2; stroke: #1565c0; } }
    </style>
  </defs>

  <rect width="1600" height="1000" fill="#fafafa"/>
  <text x="800" y="40" text-anchor="middle" font-size="26" font-weight="700" fill="#102027">ByteTrack (YOLOX-X + BYTE association) - inference pipeline &amp; weights</text>
  <text x="800" y="66" text-anchor="middle" class="ts">Tracking-by-detection: one CNN detector per frame (GPU) + lightweight motion/IoU tracker (CPU). No appearance (ReID) model is used by ByteTrack.</text>

  <!-- ============ Row 1: frame -> preprocess -> detector -> postprocess ============ -->
  <g id="frame">
    <rect class="box" x="30" y="110" width="200" height="150" fill="#eceff1"/>
    <text x="130" y="140" text-anchor="middle" class="h" fill="#37474f">Video frame t</text>
    <rect x="60" y="155" width="140" height="78" fill="#90a4ae" rx="4"/>
    <g fill="#ffffff" opacity="0.9">
      <rect x="78" y="175" width="10" height="34" rx="3"/><rect x="110" y="168" width="11" height="40" rx="3"/>
      <rect x="150" y="180" width="9" height="30" rx="3"/><rect x="172" y="172" width="10" height="36" rx="3"/>
    </g>
    <text x="130" y="252" text-anchor="middle" class="tx">30-second pedestrian clip, 30 fps</text>
  </g>

  <g id="pre">
    <rect class="box" x="275" y="100" width="250" height="170" fill="url(#cpu)"/>
    <text x="400" y="128" text-anchor="middle" class="ho">Pre-processing (CPU)</text>
    <text x="290" y="155" class="ts">• letterbox resize r=min(800/H,1440/W)</text>
    <text x="290" y="175" class="ts">• pad 114 to 800 x 1440 (top-left)</text>
    <text x="290" y="195" class="ts">• BGR-&gt;RGB, /255</text>
    <text x="290" y="215" class="ts">• (x-mean)/std  ImageNet</text>
    <text x="290" y="235" class="ts">• HWC-&gt;NCHW float32</text>
    <text x="400" y="260" text-anchor="middle" class="tx">-&gt; tensor [1,3,800,1440]</text>
  </g>

  <g id="det">
    <rect class="box pulse" x="570" y="90" width="560" height="330" fill="url(#gpu)"/>
    <text x="850" y="118" text-anchor="middle" class="h">YOLOX-X detector (GPU: PyTorch XPU / OpenVINO GPU)</text>
    <text x="850" y="138" text-anchor="middle" class="tx">depth 1.33, width 1.25 · ~99 M params · ~793 GFLOPs/frame @800x1440 · Conv+BN fused</text>
    <text x="850" y="152" text-anchor="middle" class="tx" fill="#4a148c">checkpoint: model/weights/bytetrack_x_mot17.pth.tar</text>
    <!-- backbone -->
    <rect x="590" y="155" width="150" height="190" rx="8" fill="#ffffff" stroke="#90caf9"/>
    <text x="665" y="178" text-anchor="middle" class="t" font-weight="600">Backbone</text>
    <text x="665" y="198" text-anchor="middle" class="tx">CSPDarknet-53</text>
    <text x="600" y="222" class="tx">Focus (space-to-depth)</text>
    <text x="600" y="240" class="tx">Dark2..Dark5 CSP blocks</text>
    <text x="600" y="258" class="tx">SPP bottleneck</text>
    <text x="600" y="276" class="tx">SiLU activations</text>
    <text x="600" y="300" class="tx">C3: 320ch /8</text>
    <text x="600" y="316" class="tx">C4: 640ch /16</text>
    <text x="600" y="332" class="tx">C5: 1280ch /32</text>
    <!-- neck -->
    <rect x="760" y="155" width="150" height="190" rx="8" fill="#ffffff" stroke="#90caf9"/>
    <text x="835" y="178" text-anchor="middle" class="t" font-weight="600">Neck</text>
    <text x="835" y="198" text-anchor="middle" class="tx">PAFPN</text>
    <text x="770" y="222" class="tx">top-down: upsample+cat</text>
    <text x="770" y="240" class="tx">bottom-up: s2 conv+cat</text>
    <text x="770" y="258" class="tx">CSP layers</text>
    <text x="770" y="300" class="tx">P3 100x180</text>
    <text x="770" y="316" class="tx">P4 50x90</text>
    <text x="770" y="332" class="tx">P5 25x45</text>
    <!-- head -->
    <rect x="930" y="155" width="185" height="190" rx="8" fill="#ffffff" stroke="#90caf9"/>
    <text x="1022" y="178" text-anchor="middle" class="t" font-weight="600">Decoupled head ×3</text>
    <text x="940" y="200" class="tx">stem 1x1 -&gt; cls branch 2×3x3</text>
    <text x="940" y="218" class="tx">          -&gt; reg branch 2×3x3</text>
    <text x="940" y="240" class="tx">reg (4) · obj (1, sigmoid)</text>
    <text x="940" y="258" class="tx">cls (1 = person, sigmoid)</text>
    <text x="940" y="282" class="tx">anchor-free grid decode:</text>
    <text x="940" y="298" class="tx">xy=(p+grid)·s, wh=e^p·s</text>
    <text x="940" y="316" class="tx">(folded into graph / IR)</text>
    <line x1="740" y1="250" x2="758" y2="250" class="flow"/>
    <line x1="910" y1="250" x2="928" y2="250" class="flow"/>
    <text x="850" y="372" text-anchor="middle" class="ts" font-weight="600">output [1, 23625, 6] = (cx, cy, w, h, obj, cls)</text>
    <text x="850" y="392" text-anchor="middle" class="tx">23625 = 100·180 + 50·90 + 25·45 anchor points</text>
    <text x="850" y="410" text-anchor="middle" class="tx">OpenVINO IR: FP32 / FP16 / INT8 (tracking stays on host)</text>
  </g>

  <g id="post">
    <rect class="box" x="1175" y="100" width="395" height="170" fill="url(#cpu)"/>
    <text x="1372" y="128" text-anchor="middle" class="ho">Post-processing (CPU)</text>
    <text x="1190" y="155" class="ts">• score = obj × cls</text>
    <text x="1190" y="175" class="ts">• keep score &gt;= conf_thresh 0.01</text>
    <text x="1190" y="195" class="ts">• cxcywh -&gt; x1y1x2y2 ; NMS IoU 0.7</text>
    <text x="1190" y="215" class="ts">• rescale boxes ÷ r to original frame</text>
    <text x="1372" y="245" text-anchor="middle" class="tx">-&gt; detections D_t = {(box, score)}  (keeps LOW-score boxes too!)</text>
  </g>

  <!-- row-1 arrows -->
  <path id="p1" class="flow" d="M230,185 L273,185"/>
  <path id="p2" class="flow" d="M525,185 L568,185"/>
  <path id="p3" class="flow" d="M1130,185 L1173,185"/>

  <!-- ============ Row 2: BYTE association ============ -->
  <rect class="box" x="30" y="470" width="1540" height="330" fill="url(#trk)"/>
  <text x="800" y="498" text-anchor="middle" class="hg">BYTETracker.update()  (CPU, numpy + lap.lapjv) - the "BYTE" data association</text>

  <g>
    <rect x="50" y="520" width="225" height="130" rx="8" fill="#ffffff" stroke="#81c784"/>
    <text x="162" y="543" text-anchor="middle" class="t" font-weight="600">1. Split detections</text>
    <text x="62" y="568" class="ts">D_high: score &gt; track_thresh</text>
    <text x="62" y="586" class="tx">  (0.6; per-seq 0.65 / 0.67 / 0.7)</text>
    <text x="62" y="608" class="ts">D_low : 0.1 &lt; score &lt;= track_thresh</text>
    <text x="62" y="632" class="tx">  (low boxes = occluded people)</text>
  </g>
  <g>
    <rect x="295" y="520" width="225" height="130" rx="8" fill="#ffffff" stroke="#81c784"/>
    <text x="407" y="543" text-anchor="middle" class="t" font-weight="600">2. Kalman predict</text>
    <text x="307" y="568" class="ts">tracked + lost tracks</text>
    <text x="307" y="588" class="tx">8-D const-velocity state</text>
    <text x="307" y="606" class="tx">(x, y, a, h, vx, vy, va, vh)</text>
    <text x="307" y="630" class="tx">vectorised multi_predict</text>
  </g>
  <g>
    <rect x="540" y="520" width="250" height="130" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <text x="665" y="543" text-anchor="middle" class="t" font-weight="600">3. 1st association</text>
    <text x="552" y="568" class="ts">all tracks &lt;-&gt; D_high</text>
    <text x="552" y="588" class="tx">cost = 1 - IoU·score (fuse_score)</text>
    <text x="552" y="606" class="tx">Hungarian, match_thresh 0.9</text>
    <text x="552" y="630" class="tx">matched -&gt; update KF / re-activate</text>
  </g>
  <g>
    <rect x="810" y="520" width="250" height="130" rx="8" fill="#ffffff" stroke="#2e7d32" stroke-width="2"/>
    <text x="935" y="543" text-anchor="middle" class="t" font-weight="600">4. 2nd association</text>
    <text x="822" y="568" class="ts">remaining tracked &lt;-&gt; D_low</text>
    <text x="822" y="588" class="tx">cost = 1 - IoU, thresh 0.5</text>
    <text x="822" y="606" class="tx">recovers occluded objects</text>
    <text x="822" y="630" class="tx">unmatched tracks -&gt; Lost</text>
  </g>
  <g>
    <rect x="1080" y="520" width="225" height="130" rx="8" fill="#ffffff" stroke="#81c784"/>
    <text x="1192" y="543" text-anchor="middle" class="t" font-weight="600">5. Unconfirmed / new</text>
    <text x="1092" y="568" class="tx">unconfirmed &lt;-&gt; left D_high (0.7)</text>
    <text x="1092" y="588" class="tx">new track if score &gt; thresh+0.1</text>
    <text x="1092" y="608" class="tx">lost &gt; track_buffer (30 frames,</text>
    <text x="1092" y="626" class="tx">14 / 25 for some seqs) -&gt; removed</text>
  </g>
  <g>
    <rect x="1325" y="520" width="225" height="130" rx="8" fill="#ffffff" stroke="#81c784"/>
    <text x="1437" y="543" text-anchor="middle" class="t" font-weight="600">6. Output tracks</text>
    <text x="1337" y="568" class="ts">(track_id, tlwh, score)</text>
    <text x="1337" y="590" class="tx">filter: area &gt; min_box_area 100</text>
    <text x="1337" y="608" class="tx">and w/h &lt;= 1.6</text>
    <text x="1337" y="630" class="tx">-&gt; MOT txt / overlay video</text>
  </g>
  <line x1="275" y1="585" x2="293" y2="585" class="flow"/>
  <line x1="520" y1="585" x2="538" y2="585" class="flow"/>
  <line x1="790" y1="585" x2="808" y2="585" class="flow"/>
  <line x1="1060" y1="585" x2="1078" y2="585" class="flow"/>
  <line x1="1305" y1="585" x2="1323" y2="585" class="flow"/>
  <!-- feedback loop: tracks to next frame -->
  <path class="flow" d="M1437,650 C1437,760 407,760 407,652" stroke="#2e7d32"/>
  <text x="920" y="745" text-anchor="middle" class="ts" fill="#1b5e20">track state (tracked / lost / removed) carried to frame t+1</text>
  <text x="800" y="785" text-anchor="middle" class="tx">Tracker parameters are NOT in any weight file - they come from bytetrack_tracker_config.json (track.py args + per-sequence overrides in mot_evaluator.py)</text>

  <!-- post -> tracker -->
  <path id="p4" class="flow" d="M1372,270 L1372,445 L162,445 L162,518"/>

  <!-- ============ Row 3: weights & configs ============ -->
  <text x="30" y="840" class="h" fill="#4a148c">Tutorial assets: model/weights and output/models</text>
  <g>
    <rect class="box" x="30" y="855" width="370" height="125" fill="#ede7f6"/>
    <text x="45" y="878" class="t" font-weight="700">model/weights/bytetrack_x_mot17.pth.tar</text>
    <text x="45" y="899" class="tx">YOLOX-X detector, 1 class (person). Trained on CrowdHuman +</text>
    <text x="45" y="915" class="tx">MOT17 + CityPersons + ETHZ (exps/.../yolox_x_mix_det.py).</text>
    <text x="45" y="931" class="tx">Paper: MOT17 test MOTA 80.3 / IDF1 77.3 / HOTA 63.1.</text>
    <text x="45" y="955" class="ts" font-weight="600" fill="#4a148c">USED by ByteTrack</text>
  </g>
  <g>
    <rect class="box" x="420" y="855" width="370" height="125" fill="#f5f5f5" stroke-dasharray="6 4"/>
    <text x="435" y="878" class="t" font-weight="700">ReID weights: not downloaded</text>
    <text x="435" y="899" class="tx">FastReID SBS-S50 (ResNet-50-IBN) person ReID, 384x128 crops.</text>
    <text x="435" y="915" class="tx">Used by BoT-SORT / DeepSORT-style trackers for appearance.</text>
    <text x="435" y="931" class="tx">ByteTrack is motion + IoU only - this file is NOT needed.</text>
    <text x="435" y="955" class="ts" font-weight="600" fill="#9e9e9e">NOT used by ByteTrack</text>
  </g>
  <g>
    <rect class="box" x="810" y="855" width="370" height="125" fill="#e0f7fa"/>
    <text x="825" y="878" class="t" font-weight="700">BYTE-TRACK/openvino_ir/{FP32,FP16}/</text>
    <text x="825" y="899" class="tx">bytetrack_x_mot17.xml/.bin - this work (decode in graph,</text>
    <text x="825" y="915" class="tx">tracker config embedded in rt_info). FP32 -&gt; FP16 conversion.</text>
    <text x="825" y="931" class="tx">(older openvino_models/{detector,reid_bs1,reid_bs8} also exist)</text>
    <text x="825" y="955" class="ts" font-weight="600" fill="#006064">Same network, OpenVINO runtime</text>
  </g>
  <g>
    <rect class="box" x="1200" y="855" width="370" height="125" fill="#fff3e0"/>
    <text x="1215" y="878" class="t" font-weight="700">openvino_ir/bytetrack_tracker_config.json</text>
    <text x="1215" y="899" class="tx">pre-proc (800x1440, mean/std, pad 114), post-proc</text>
    <text x="1215" y="915" class="tx">(conf 0.01, NMS 0.7), BYTE params (0.6 / 0.9 / 0.5 /</text>
    <text x="1215" y="931" class="tx">buffer 30 / min area 100) + MOT17 per-sequence overrides</text>
    <text x="1215" y="955" class="ts" font-weight="600" fill="#e65100">Needed by BOTH PyTorch and OpenVINO</text>
  </g>
  <path class="dash" d="M1385,855 C1385,830 1300,820 1300,802"/>

  <!-- legend -->
  <g transform="translate(30,78)">
    <rect x="0" y="0" width="16" height="12" fill="url(#gpu)" stroke="#546e7a"/><text x="22" y="11" class="tx">GPU (iGPU Arc B390)</text>
    <rect x="140" y="0" width="16" height="12" fill="url(#cpu)" stroke="#546e7a"/><text x="162" y="11" class="tx">CPU</text>
    <rect x="200" y="0" width="16" height="12" fill="url(#trk)" stroke="#546e7a"/><text x="222" y="11" class="tx">CPU tracker</text>
  </g>

  <!-- ============ animation: a "frame token" flowing through the pipeline ============ -->
  <circle cx="130" cy="185" r="9" fill="#d32f2f" opacity="0.9">
    <animateMotion id="tok" dur="9s" repeatCount="indefinite" calcMode="paced"
      path="M0,0 L270,0 L720,65 L1242,0 L1242,260 L32,260 L32,400 L277,400 L535,400 L805,400 L1062,400 L1307,400"/>
  </circle>
  <circle cx="130" cy="185" r="5" fill="#ffffff">
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="paced"
      path="M0,0 L270,0 L720,65 L1242,0 L1242,260 L32,260 L32,400 L277,400 L535,400 L805,400 L1062,400 L1307,400"/>
  </circle>
  <!-- secondary token showing the per-frame tracker state loop -->
  <circle cx="1437" cy="650" r="6" fill="#2e7d32" opacity="0.85">
    <animateMotion dur="9s" repeatCount="indefinite" calcMode="paced" path="M0,0 C0,110 -1030,110 -1030,2"/>
  </circle>
</svg>
