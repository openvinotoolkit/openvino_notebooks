#
# Conda environment for the OpenVINO-accelerated pyannote speaker-diarization
# pipeline (pyannote/speaker-diarization-community-1).
#
# Same as diar_cpu.yaml, plus OpenVINO. The two heavy neural blocks
# (segmentation PyanNet + embedding WeSpeakerResNet34's ResNet) are converted to
# OpenVINO IR and run with the OpenVINO runtime; pyannote keeps orchestrating
# windowing / clustering / PLDA on CPU.
#
# The pipeline is gated: accept the user conditions once and log in --
#   https://hf.co/pyannote/speaker-diarization-community-1
#   https://hf.co/pyannote/segmentation-3.0
#   huggingface-cli login          # paste your HF access token
#
# Create with:
#   conda env create -f diar_ov.yaml
#   conda activate diar_ov

name: diar_ov
channels:
 - conda-forge
dependencies:
 - python==3.11.15
 - pip
 - pip:
   # Core pipeline (segmentation + embedding + clustering)
   - pyannote.audio==4.0.7
   # PyTorch CPU build (used for orchestration + fbank + tracing)
   - torch==2.12.1
   - torchaudio==2.11.0
   # OpenVINO runtime + IR conversion
   - openvino==2026.2.1
   # Checkpoint loading (pyannote pickles omegaconf objects)
   - omegaconf==2.3.1
   # Audio I/O and resampling
   - soundfile==0.14.0
   - scipy==1.17.1
   - numpy==2.4.6
